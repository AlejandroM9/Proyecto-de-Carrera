<!DOCTYPE html>
<html lang="es">
<head>
	<meta  charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Actualizar Datos de Sensores</title>

	<!-- Bootstrap 5 -->
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
	/>

	<!-- Icono principal -->
	<link
		rel="icon"
		type="image/png"
		href="https://cdn.jsdelivr.net/gh/twbs/icons@1.11.2/icons/file-earmark-bar-graph.svg"
	/>

	<style>
		body {
			backround: #f4f6f9;
		}
		.card {
			box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
		}
		.toast-container {
			position: fixed;
			top: 1rem;
			right: 1rem;
			z-index: 1080;
		}
	</style>
</head>
<body>
	<div class="container py-4">
		<h1 class="mb-4 text-center">Panel de sensores registrados</h1>

		<!-- Tarjeta con tabla de sensores -->
		<div class="card mb-4">
			<div class="card-header bg-primary text-white">
				<strong>Estado actual de sensores</strong>
			</div>
			<div class="card-body p-0">
				<div class="table-responsive">
					<table class="table table-hover mb-0">
						<thead class="table-light">
							<tr>
								<th>#</th>
								<th>ID</th>
								<th>Limite de sonido</th>
								<th>Piso</th>
								<th>Tipo</th>
								<th>Area</th>
							</tr>
						</thead>
						<tbody id="tabla-backups"></tbody>
					</table>
				</div>
			</div>
		</div>

		<!-- Tarjeta con formulario de actualizacion -->
		<div class="card">
			<div class="card-header bg-secondary text-white">
				<strong>Actualizar datos</strong>
			</div>
			<div class="card-body">
				<form id="form-actualizar" class="row g-3 needs-validation" novalidate>
					<div class="col-md-4">
						<label for="backup_sel" class="form-label">Sensor (1-3)</label>
						<select id="backup_sel" class="form-select" required>
							<option value="" selected hidden>Elegir...</option>
							<option value="1">Sensor 1</option>
							<option value="2">Sensor 2</option>
							<option value="3">Sensor 3</option>
						</select>
						<div class="invalid-feedback">Selecciona un sensore regitrado.</div>
					</div>

					<div class="col-md-4">
						<label for="id_val" class="form-label">Nuevo ID</label>
						<input type="number" id="id_val" class="form-control" min="0" required/>
						<div class="invalid-feedback">Introduce un ID numerico.</div>
					</div>

					<div class="col-md-4">
						<label for="limit_val" class="for-label">Nuevo Limite de sonido</label>
						<input type="number" id="limit_val" class="form-control" min="0" required/>
						<div class="invalid-feedback">Introduce un limite de sonido numerico.</div>
					</div>

					<div class="col-12 text-end">
						<button class="btn btn-success" type="submit">Actualizar</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Contenedor de toasts -->
	<div class="toast-container" id="toast-container"></div>

	<!-- Bootstrap JS (incluye Popper) -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<script>
		const toastContainer = document.getElementById("toast-container");
		function showToast(msg, ok = true){
			const toast = document.createElement("div");
			toast.className = `toast align-items-center text-bg-${
				ok ? "success" : "danger"
			} border-0`;
			toast.role = "alert";
			toast.innerHTML = `
				<div class="d-flex">
					<div class="toast-body">${msg}</div>
					<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
				</div>`;
			toastContainer.appendChild(toast);
			const bsToast = new bootstrap.Toast(toast, { delay: 3000 });
			bsToast.show();
			toast.addEventListener("hidden.bs.toast", () => toast.remove());
		}

		async function cargarDatos(){
			try{
				const res = await fetch("/backup");
				const data = await res.json();

				const tbody = document.getElementById("tabla-backups");
				tbody.innerHTML = "";

				[data.backup1, data.backup2, data.backup3].forEach((b, idx) => {
					const tr = document.createElement("tr");
					tr.innerHTML = `
						<th>${idx + 1}</th>
						<td>${b.id}</td>
						<td>${b.limit_sound}</td>
						<td>${b.piso}</td>
						<td>${b.tipo}</td>
						<td>${b.area}</td>
					</tr>`;
					tbody.appendChild(tr);
				});
			} catch (e){
				showToast("Error al cargar datos", false);
				console.error(e);
			}
		}

		async function actualizarDatos(evt){
			evt.preventDefault();

			const form = evt.target;
			if(!form.checkValidity()){
				form.classList.add("was-validated");
				return;
			}

			const backup = document.getElementById("backup_sel").value;
			const id = document.getElementById("id_val").value;
			const limit = document.getElementById("limit_val").value;

			try{
				const res = await fetch(`/update?backup=${backup}&id=${id}&limit=${limit}`);
				const msg = await res.text();
				showToast(msg, res.ok);
				cargarDatos();
				form.reset();
				form.classList.remove("was-validated");
			} catch (e) {
				showToast("Error al actualizar", false);
				console.error(e);
			}
		}

		window.addEventListener("DOMContentLoaded", () => {
			cargarDatos();
			document
				.getElementById("form-actualizar")
				.addEventListener("submit", actualizarDatos);
		})
	</script>
</body>
</html>
